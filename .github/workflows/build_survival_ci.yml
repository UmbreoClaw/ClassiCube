name: Survival branch CI (compile check + artifacts)
# Lightweight compile-only verification for the survival test branch.
# Cross-compiles the Windows builds with mingw (as the main Windows workflow
# does) using -Werror, so any compilation regression fails the check.
# Artifacts are uploaded so the branch can be tested without a local toolchain.
on:
  push:
    branches:
      - 'survival-test'
      - 'claude/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-survival-ci
  cancel-in-progress: true

jobs:
#============================================
# ============== 32 BIT WINDOWS =============
# ===========================================
  build-win32:
    name: Windows 32-bit (mingw)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install mingw
        shell: bash
        run: sudo apt-get -y install gcc-mingw-w64-i686

      - name: Compile 32 bit Windows builds
        shell: bash
        env:
          LIBS: "-lwinmm -limagehlp"
          SRCS: "src/*.c third_party/bearssl/*.c"
          COMMON_FLAGS: "-O1 -fno-stack-protector -fno-math-errno -Qn -Werror"
          WIN32_FLAGS:  "-mwindows -nostartfiles -Wl,-e_main_real -DCC_NOMAIN"
        run: |
          i686-w64-mingw32-gcc ${{ env.SRCS }} ${{ env.COMMON_FLAGS }} ${{ env.WIN32_FLAGS }} -o cc-w32-d3d9.exe  ${{ env.LIBS }}
          i686-w64-mingw32-gcc ${{ env.SRCS }} ${{ env.COMMON_FLAGS }} ${{ env.WIN32_FLAGS }} -o cc-w32-ogl.exe   -DCC_GFX_BACKEND=CC_GFX_BACKEND_GL1 ${{ env.LIBS }}
          i686-w64-mingw32-gcc ${{ env.SRCS }} ${{ env.COMMON_FLAGS }} ${{ env.WIN32_FLAGS }} -o cc-w32-d3d11.exe -DCC_GFX_BACKEND=CC_GFX_BACKEND_D3D11 ${{ env.LIBS }}

      - name: Upload 32-bit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClassiCube-SurvivalTest-Win32
          path: |
            cc-w32-d3d9.exe
            cc-w32-ogl.exe
            cc-w32-d3d11.exe
          retention-days: 14

#============================================
# ============== 64 BIT WINDOWS =============
# ===========================================
  build-win64:
    name: Windows 64-bit (mingw)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install mingw
        shell: bash
        run: sudo apt-get -y install gcc-mingw-w64-x86-64

      - name: Compile 64 bit Windows builds
        shell: bash
        env:
          LIBS: "-lwinmm -limagehlp"
          SRCS: "src/*.c third_party/bearssl/*.c"
          COMMON_FLAGS: "-O1 -fno-stack-protector -fno-math-errno -Qn -Werror"
          WIN64_FLAGS:  "-mwindows -nostartfiles -Wl,-emain_real -DCC_NOMAIN"
        run: |
          x86_64-w64-mingw32-gcc ${{ env.SRCS }} ${{ env.COMMON_FLAGS }} ${{ env.WIN64_FLAGS }} -o cc-w64-d3d9.exe  ${{ env.LIBS }}
          x86_64-w64-mingw32-gcc ${{ env.SRCS }} ${{ env.COMMON_FLAGS }} ${{ env.WIN64_FLAGS }} -o cc-w64-ogl.exe   -DCC_GFX_BACKEND=CC_GFX_BACKEND_GL1 ${{ env.LIBS }}
          x86_64-w64-mingw32-gcc ${{ env.SRCS }} ${{ env.COMMON_FLAGS }} ${{ env.WIN64_FLAGS }} -o cc-w64-d3d11.exe -DCC_GFX_BACKEND=CC_GFX_BACKEND_D3D11 ${{ env.LIBS }}

      - name: Upload 64-bit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClassiCube-SurvivalTest-Win64
          path: |
            cc-w64-d3d9.exe
            cc-w64-ogl.exe
            cc-w64-d3d11.exe
          retention-days: 14

#============================================
# =============== 64 BIT MACOS ==============
# ===========================================
# Native Cocoa builds (no -Werror here: the mingw jobs above are the strict
# compile gate; a clang-only warning must not block getting a Mac artifact).
# The arm64 slice is ad-hoc signed by the linker, which Apple Silicon
# requires; lipo preserves per-slice signatures.
  build-mac64:
    name: macOS 64-bit (clang)
    timeout-minutes: 15
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compile 64 bit macOS builds
        shell: bash
        env:
          LIBS: "-framework Security -framework Cocoa -framework OpenGL -framework IOKit -lobjc"
          SRCS: "src/*.c src/Window_cocoa.m third_party/bearssl/*.c"
          FLAGS: "-O1 -fno-stack-protector -fno-math-errno -Qn -fvisibility=hidden -rdynamic"
          ARM64_FLAGS: "-DCC_GFX_BACKEND=CC_GFX_BACKEND_GL2 -arch arm64"
          INTEL64_FLAGS: "-arch x86_64"
        run: |
          LATEST_FLAG=-DCC_COMMIT_SHA=\"$(git rev-parse --short "$GITHUB_SHA")\"

          clang ${{ env.SRCS }} ${{ env.FLAGS }} ${{ env.INTEL64_FLAGS }} $LATEST_FLAG -DCC_GFX_BACKEND=CC_GFX_BACKEND_GL2 -o cc-mac64-gl2-x64 ${{ env.LIBS }}
          clang ${{ env.SRCS }} ${{ env.FLAGS }} ${{ env.ARM64_FLAGS }}   $LATEST_FLAG -o cc-mac64-gl2-arm64 ${{ env.LIBS }}

      - name: Generate combined Intel + ARM64 build
        shell: bash
        run: |
          lipo -create -output cc-mac64-gl2 cc-mac64-gl2-x64 cc-mac64-gl2-arm64

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClassiCube-SurvivalTest-mac64
          path: |
            cc-mac64-gl2
            cc-mac64-gl2-arm64
          retention-days: 14
