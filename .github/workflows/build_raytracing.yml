name: Build ray tracing (Windows + Linux)
# Builds the OpenGL variants of the game (the ones that can run the GPU ray tracer) and
# uploads them as workflow artifacts. Runs on pushes to the ray tracing branches and on demand.
on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
      - 'raytracing*'
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-raytracing
  cancel-in-progress: true

jobs:
  #============================================
  # ============ SHADERS ARE IN SYNC ==========
  # ===========================================
  check-shaders:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify embedded shader header matches misc/raytracing sources
        shell: bash
        run: |
          python3 misc/raytracing/embed_shaders.py
          git diff --exit-code src/_RayTracerShaders.h || {
            echo "::error::src/_RayTracerShaders.h is out of date - run python3 misc/raytracing/embed_shaders.py and commit"
            exit 1
          }

  #============================================
  # ============== 64 BIT WINDOWS =============
  # ===========================================
  build-win64:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install packages
        shell: bash
        run: |
          sudo apt-get -y install gcc-mingw-w64-x86-64

      - name: Compile 64 bit Windows OpenGL build
        shell: bash
        env:
          LIBS: "-lwinmm -limagehlp"
          SRCS: "src/*.c third_party/bearssl/*.c"
          COMMON_FLAGS: "-O2 -s -fno-stack-protector -fno-math-errno -Qn -Werror"
          WIN64_FLAGS:  "-mwindows -nostartfiles -Wl,-emain_real -DCC_NOMAIN misc/windows/CCicon_64.res"
        run: |
          LATEST_FLAG=-DCC_COMMIT_SHA=\"$(git rev-parse --short "$GITHUB_SHA")\"

          x86_64-w64-mingw32-gcc ${{ env.SRCS }} ${{ env.COMMON_FLAGS }} ${{ env.WIN64_FLAGS }} -o cc-w64-ogl.exe $LATEST_FLAG -DCC_GFX_BACKEND=CC_GFX_BACKEND_GL1 ${{ env.LIBS }}

      - uses: actions/upload-artifact@v4
        with:
          name: ClassiCube-Win64-OpenGL-RayTracing
          path: cc-w64-ogl.exe
          if-no-files-found: error

  #============================================
  # ============== 32 BIT WINDOWS =============
  # ===========================================
  build-win32:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install packages
        shell: bash
        run: |
          sudo apt-get -y install gcc-mingw-w64-i686

      - name: Compile 32 bit Windows OpenGL build
        shell: bash
        env:
          LIBS: "-lwinmm -limagehlp"
          SRCS: "src/*.c third_party/bearssl/*.c"
          COMMON_FLAGS: "-O2 -s -fno-stack-protector -fno-math-errno -Qn -Werror"
          WIN32_FLAGS:  "-mwindows -nostartfiles -Wl,-e_main_real -DCC_NOMAIN misc/windows/CCicon_32.res"
        run: |
          LATEST_FLAG=-DCC_COMMIT_SHA=\"$(git rev-parse --short "$GITHUB_SHA")\"

          i686-w64-mingw32-gcc ${{ env.SRCS }} ${{ env.COMMON_FLAGS }} ${{ env.WIN32_FLAGS }} -o cc-w32-ogl.exe $LATEST_FLAG -DCC_GFX_BACKEND=CC_GFX_BACKEND_GL1 ${{ env.LIBS }}

      - uses: actions/upload-artifact@v4
        with:
          name: ClassiCube-Win32-OpenGL-RayTracing
          path: cc-w32-ogl.exe
          if-no-files-found: error

  #============================================
  # ================== LINUX ==================
  # ===========================================
  build-linux:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install packages
        shell: bash
        run: |
          sudo apt-get -y install libx11-dev libxi-dev libgl1-mesa-dev

      - name: Compile 64 bit Linux build
        shell: bash
        run: |
          LATEST_FLAG=-DCC_COMMIT_SHA=\"$(git rev-parse --short "$GITHUB_SHA")\"
          make linux RELEASE=1 EXTRA_CFLAGS="$LATEST_FLAG" -j4

      - uses: actions/upload-artifact@v4
        with:
          name: ClassiCube-Linux64-OpenGL-RayTracing
          path: ClassiCube
          if-no-files-found: error
