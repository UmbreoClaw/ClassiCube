name: Build latest (iOS modern)
# Modern iOS build - arm64 only, iOS 16+, optimized for recent iPhones/iPads.
# Produces an unsigned .ipa artifact that can be sideloaded (AltStore / Sideloadly).
on:
  push:
    branches:
      - main
      - master
      - claude/classicube-ios-modernize-f71jin
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-ios-modern
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 15
    runs-on: macOS-14
    steps:
      - uses: actions/checkout@v5

      - name: Setup environment
        run: |
          sudo xcode-select -s /Applications/Xcode_15.0.1.app/Contents/Developer
          echo "XCODE_APP=Xcode_15.0.1.app" >> "$GITHUB_ENV"
          echo "IOS_SDK_VERSION=17.0" >> "$GITHUB_ENV"

      - name: Compile modern iOS build
        run: |
          make ios_modern

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: cc-modern-ios.ipa
          path: 'ClassiCube-iPhoneOS.ipa'
          if-no-files-found: error
